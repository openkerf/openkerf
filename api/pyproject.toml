[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "openkerf-api"
version = "0.1.0"
description = "Read-only status API for the MeerK40t engine, as an external plugin"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    # Pin — verhogen is een bewuste stap, zie "Upstream-versiebeheer" in CLAUDE.md.
    "meerk40t>=0.9.9000,<0.10",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "websockets>=12",
    "python-multipart>=0.0.9",  # file uploads on /api/job/load
    "segno>=1.6",  # QR-codes als pad, niet als plaatje
    "python-barcode>=0.15",  # streepjescodes: codering, wij tekenen de streepjes
    "fonttools>=4.50",  # eigen lettertypen omzetten naar wat de engine leest
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# Camerabeeld is optioneel; zonder OpenCV trekt de cameraplugin van de engine
# zichzelf terug en meldt onze API netjes dat het er niet is.
camera = ["opencv-python-headless>=4.9"]

# This is what makes MeerK40t pick the plugin up automatically —
# no change to the MeerK40t repository is needed.
[project.entry-points."meerk40t.extension"]
openkerf_api = "openkerf_api.plugin:plugin"

[tool.setuptools.packages.find]
include = ["openkerf_api*"]

[tool.black]
line-length = 88
